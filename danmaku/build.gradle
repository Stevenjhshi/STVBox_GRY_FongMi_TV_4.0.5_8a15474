plugins {
    id 'com.android.library'
}

android {
    namespace 'master.flame.danmaku'

    compileSdk 36

    defaultConfig {
        minSdk 21
        //noinspection ExpiredTargetSdkVersion
        targetSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
