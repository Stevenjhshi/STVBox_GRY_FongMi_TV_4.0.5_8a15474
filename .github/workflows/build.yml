name: STVBox_GRY Build APK
run-name: STVBox_GRY build #${{ github.run_number }}

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: STVBox_GRY (leanback/armeabi-v7a/release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build timestamp
        id: ts
        run: |
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          echo "BUILD_CODE=$(TZ=Asia/Shanghai date +%s)" >> "$GITHUB_ENV"
          echo "run_name=STVBox_GRY $(TZ=Asia/Shanghai date +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 platform and build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build STVBox_GRY release (leanback/armeabi-v7a, TV only, 32-bit)
        env:
          BUILD_TIME: ${{ env.BUILD_TIME }}
          BUILD_CODE: ${{ env.BUILD_CODE }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleLeanbackArmeabi_v7aRelease

      - name: Collect APK
        run: |
          echo "=== output dirs ==="
          find app/build/outputs -maxdepth 5 -type d -print 2>/dev/null || true
          echo "=== apk files ==="
          find app/build/outputs -name "*.apk" -type f -print 2>/dev/null || true
          mkdir -p dist
          APK=$(find app/build/outputs -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then echo "NO APK FOUND"; exit 1; fi
          cp "$APK" "dist/STVBox_GRY_${BUILD_TIME}_leanback-armeabi_v7a.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: STVBox_GRY_${{ env.BUILD_TIME }}
          path: dist/*.apk
          if-no-files-found: error
