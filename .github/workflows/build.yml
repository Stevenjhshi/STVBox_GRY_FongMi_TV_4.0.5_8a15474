name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build FongMi TV 4.0.5 (armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs (armeabi-v7a, 32-bit)
        run: ./gradlew --no-daemon --stacktrace :app:assembleLeanbackArmeabi_v7aRelease :app:assembleMobileArmeabi_v7aRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-tv-4.0.5-armeabi-v7a
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
